name: Apply v3 improvements

on:
  push:
    branches:
      - improvements-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply v3 improvements') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch application
        shell: python
        run: |
          from pathlib import Path
          import json, re, subprocess

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Keep Expo SDK 54 compatible dependency versions.
          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data.setdefault('dependencies', {})['expo-document-picker'] = '~14.0.8'
          data.setdefault('devDependencies', {})['react-native-webview'] = '13.15.0'
          data.setdefault('devDependencies', {})['@stardazed/streams-text-encoding'] = '^1.0.2'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Data model: preserve old single photos and add multiple photos/PDF attachments.
          p = Path('context/AppContext.tsx')
          s = p.read_text(encoding='utf-8')
          patch('context/AppContext.tsx', '  photoUri?: string;\n};', '  photoUri?: string;\n  photoUris?: string[];\n};')
          patch('context/AppContext.tsx', '  imageUri: string;\n\n  notes?: string;', '  imageUri: string;\n  pdfUri?: string;\n  pdfName?: string;\n\n  notes?: string;')
          patch('context/AppContext.tsx', "                photoUri:\n                  visit.photoUri\n                    ? String(\n                        visit.photoUri\n                      )\n                    : undefined,", "                photoUri:\n                  visit.photoUri\n                    ? String(\n                        visit.photoUri\n                      )\n                    : undefined,\n\n                photoUris:\n                  Array.isArray(visit.photoUris)\n                    ? visit.photoUris.map((item: any) => String(item))\n                    : visit.photoUri\n                      ? [String(visit.photoUri)]\n                      : [],")
          patch('context/AppContext.tsx', "                imageUri:\n                  String(\n                    book.imageUri ??\n                      ''\n                  ),", "                imageUri:\n                  String(\n                    book.imageUri ??\n                      ''\n                  ),\n\n                pdfUri:\n                  book.pdfUri\n                    ? String(book.pdfUri)\n                    : undefined,\n\n                pdfName:\n                  book.pdfName\n                    ? String(book.pdfName)\n                    : undefined,")
          p.write_text(s, encoding='utf-8')

          # Visit form: keyboard-aware scrolling and multiple record photos.
          p = Path('app/visit-form.tsx')
          s = p.read_text(encoding='utf-8')
          patch('app/visit-form.tsx', '  Image,\n  Pressable,', '  Image,\n  KeyboardAvoidingView,\n  Platform,\n  Pressable,')
          patch('app/visit-form.tsx', "  const [\n    photoUri,\n    setPhotoUri,\n  ] = useState<\n    string | undefined\n  >(undefined);", "  const [\n    photoUri,\n    setPhotoUri,\n  ] = useState<string | undefined>(undefined);\n\n  const [photoUris, setPhotoUris] = useState<string[]>([]);")
          patch('app/visit-form.tsx', "    setPhotoUri(\n      existingVisit.photoUri\n    );", "    setPhotoUri(existingVisit.photoUri);\n    setPhotoUris(\n      Array.isArray((existingVisit as any).photoUris)\n        ? (existingVisit as any).photoUris\n        : existingVisit.photoUri\n          ? [existingVisit.photoUri]\n          : []\n    );")
          patch('app/visit-form.tsx', "          setPhotoUri(\n            result.assets[0].uri\n          );\n\n          clearMessage();", "          const uri = result.assets[0].uri;\n          setPhotoUri(uri);\n          setPhotoUris((current) =>\n            current.includes(uri) ? current : [...current, uri]\n          );\n          clearMessage();")
          patch('app/visit-form.tsx', "          photoUri:\n            photoUri,", "          photoUri:\n            photoUris[0] || photoUri,\n\n          photoUris:
            photoUris,")
          # KeyboardAvoidingView wrapper.
          patch('app/visit-form.tsx', "      <ScrollView\n        showsVerticalScrollIndicator=", "      <KeyboardAvoidingView\n        style={{ flex: 1 }}\n        behavior={Platform.OS === 'ios' ? 'padding' : 'height'}\n      >\n        <ScrollView\n        showsVerticalScrollIndicator=")
          patch('app/visit-form.tsx', "      </ScrollView>\n    </View>\n  );", "        </ScrollView>\n      </KeyboardAvoidingView>\n    </View>\n  );")
          # Make previous visit card directly actionable.
          patch('app/visit-form.tsx', "          <View\n            style={[\n              styles.previousVisitCard,", "          <Pressable\n            onPress={() => latestVisit && router.push({ pathname: '/visit-details', params: { visitId: String(latestVisit.id) } })}\n            disabled={!latestVisit}\n            style={[\n              styles.previousVisitCard,")
          # Close the converted previous visit card at its first matching end.
          marker = "            )}\n          </View>\n        ) : null}\n\n        {/* نوع الزيارة */}"
          replacement = "            )}\n          </Pressable>\n        ) : null}\n\n        {/* نوع الزيارة */}"
          if marker not in s:
              raise SystemExit('previous visit closing pattern not found')
          s = s.replace(marker, replacement, 1)

          # Replace single-image preview block with a multi-photo gallery.
          pattern = re.compile(r"        /\* الصورة \*/\n\n        \{photoUri \? \(.*?        \) : null\}\n\n        /\* الرسالة \*/", re.S)
          gallery = '''        {/* الصور المرفقة */}\n\n        {photoUris.length > 0 ? (\n          <View>\n            <Text style={[styles.label, { color: c.foreground }]}>صور سجل الزيارة ({photoUris.length})</Text>\n            <ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={{ gap: 8, paddingBottom: 4 }}>\n              {photoUris.map((uri, index) => (\n                <Pressable\n                  key={`${uri}-${index}`}\n                  onPress={() =>\n                    router.push({\n                      pathname: '/image-viewer',\n                      params: { uri, title: `صورة السجل ${index + 1}` },\n                    })\n                  }\n                  style={styles.photoThumbWrap}\n                >\n                  <Image source={{ uri }} style={styles.photoThumb} resizeMode="cover" />\n                  <View style={styles.photoIndex}><Text style={styles.photoIndexText}>{index + 1}</Text></View>\n                </Pressable>\n              ))}\n            </ScrollView>\n            <Pressable\n              onPress={takePhoto}\n              style={[styles.addPhotoButton, { backgroundColor: c.secondary, borderColor: c.border }]}\n            >\n              <Feather name="camera" size={18} color={c.primary} />\n              <Text style={[styles.addPhotoText, { color: c.primary }]}>إضافة صورة أخرى</Text>\n            </Pressable>\n          </View>\n        ) : null}\n\n        {/* الرسالة */}'''
          if not pattern.search(s):
              raise SystemExit('single photo block not found')
          s = pattern.sub(gallery, s, count=1)

          # Add viewer-friendly thumbnail styles before message styles.
          patch('app/visit-form.tsx', "    /* الرسالة */\n", "    /* الرسالة */\n") if False else None
          style_anchor = "    camera: {"
          style_insert = "    photoThumbWrap: { width: 92, height: 118, borderRadius: 12, overflow: 'hidden', position: 'relative', borderWidth: 1, borderColor: '#D6E9F0' },\n    photoThumb: { width: '100%', height: '100%' },\n    photoIndex: { position: 'absolute', left: 5, bottom: 5, minWidth: 24, height: 24, borderRadius: 8, backgroundColor: 'rgba(0,0,0,0.55)', alignItems: 'center', justifyContent: 'center' },\n    photoIndexText: { color: '#FFFFFF', fontFamily: 'Inter_700Bold', fontSize: 10 },\n    addPhotoButton: { marginTop: 8, minHeight: 44, borderRadius: 12, borderWidth: 1, flexDirection: 'row-reverse', alignItems: 'center', justifyContent: 'center', gap: 7 },\n    addPhotoText: { fontFamily: 'Inter_600SemiBold', fontSize: 12 },\n\n    camera: {"
          if style_anchor not in s:
              raise SystemExit('camera style anchor not found')
          s = s.replace(style_anchor, style_insert, 1)
          p.write_text(s, encoding='utf-8')

          # In-app image viewer with Android-friendly zoom controls.
          Path('app/image-viewer.tsx').write_text(r'''import React, { useState } from 'react';
import { Image, Pressable, StyleSheet, Text, View } from 'react-native';
import { router, useLocalSearchParams } from 'expo-router';
import { Feather } from '@expo/vector-icons';
import { useSafeAreaInsets } from 'react-native-safe-area-context';
import { useColors } from '@/hooks/useColors';

export default function ImageViewer() {
  const c = useColors();
  const insets = useSafeAreaInsets();
  const params = useLocalSearchParams<{ uri?: string; title?: string }>();
  const uri = Array.isArray(params.uri) ? params.uri[0] : params.uri;
  const title = Array.isArray(params.title) ? params.title[0] : params.title;
  const [scale, setScale] = useState(1);

  return (
    <View style={[styles.page, { backgroundColor: '#0A1115' }]}>
      <View style={[styles.header, { paddingTop: insets.top + 8 }]}>
        <Pressable onPress={() => router.back()} style={styles.button}>
          <Feather name="arrow-right" size={22} color="#FFFFFF" />
        </Pressable>
        <Text style={styles.title} numberOfLines={1}>{title || 'عرض الصورة'}</Text>
        <View style={styles.controls}>
          <Pressable onPress={() => setScale((v) => Math.min(3, +(v + 0.25).toFixed(2)))} style={styles.smallButton}><Text style={styles.controlText}>+</Text></Pressable>
          <Pressable onPress={() => setScale(1)} style={styles.smallButton}><Text style={styles.controlText}>1×</Text></Pressable>
          <Pressable onPress={() => setScale((v) => Math.max(1, +(v - 0.25).toFixed(2)))} style={styles.smallButton}><Text style={styles.controlText}>−</Text></Pressable>
        </View>
      </View>
      <View style={styles.viewer}>
        {uri ? <Image source={{ uri }} resizeMode="contain" style={[styles.image, { transform: [{ scale }] }]} /> : null}
      </View>
      <Text style={styles.hint}>استخدم + و− لتكبير الصورة وقراءة السجل بوضوح</Text>
    </View>
  );
}

const styles = StyleSheet.create({
  page: { flex: 1 },
  header: { minHeight: 58, paddingHorizontal: 12, flexDirection: 'row-reverse', alignItems: 'center', justifyContent: 'space-between' },
  button: { width: 42, height: 42, borderRadius: 13, backgroundColor: 'rgba(255,255,255,0.12)', alignItems: 'center', justifyContent: 'center' },
  title: { flex: 1, color: '#FFFFFF', textAlign: 'center', fontFamily: 'Inter_700Bold', fontSize: 15, paddingHorizontal: 10 },
  controls: { flexDirection: 'row', gap: 5 },
  smallButton: { minWidth: 34, height: 34, borderRadius: 10, backgroundColor: 'rgba(255,255,255,0.12)', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 6 },
  controlText: { color: '#FFFFFF', fontFamily: 'Inter_700Bold', fontSize: 15 },
  viewer: { flex: 1, alignItems: 'center', justifyContent: 'center', overflow: 'hidden' },
  image: { width: '100%', height: '100%' },
  hint: { color: '#B8C8CF', textAlign: 'center', fontFamily: 'Inter_400Regular', fontSize: 10, paddingBottom: 18, paddingHorizontal: 12 },
});
''', encoding='utf-8')

          # Ministry books: add PDF attachment support while preserving existing images.
          p = Path('app/ministry-books.tsx')
          s = p.read_text(encoding='utf-8')
          patch('app/ministry-books.tsx', "import * as ImagePicker from 'expo-image-picker';", "import * as ImagePicker from 'expo-image-picker';\nimport * as DocumentPicker from 'expo-document-picker';")
          patch('app/ministry-books.tsx', "  const [imageUri, setImageUri] = useState('');\n\n  const [notes, setNotes]", "  const [imageUri, setImageUri] = useState('');\n  const [pdfUri, setPdfUri] = useState('');\n  const [pdfName, setPdfName] = useState('');\n\n  const [notes, setNotes]")
          patch('app/ministry-books.tsx', "    setImageUri('');\n\n    setNotes('');", "    setImageUri('');\n    setPdfUri('');\n    setPdfName('');\n\n    setNotes('');")
          patch('app/ministry-books.tsx', "    setImageUri(book.imageUri);\n\n    setNotes(book.notes ?? '');", "    setImageUri(book.imageUri);\n    setPdfUri(book.pdfUri ?? '');\n    setPdfName(book.pdfName ?? '');\n\n    setNotes(book.notes ?? '');")
          insert_after = "  const takePhoto = async () => {"
          pdf_fn = '''  const pickPdf = async () => {\n    try {\n      const result = await DocumentPicker.getDocumentAsync({\n        type: 'application/pdf',\n        multiple: false,\n        copyToCacheDirectory: true,\n      });\n      if (!result.canceled && result.assets?.[0]?.uri) {\n        setPdfUri(result.assets[0].uri);\n        setPdfName(result.assets[0].name || 'كتاب وزاري.pdf');\n      }\n    } catch (error) {\n      console.error(error);\n      Alert.alert('خطأ', 'تعذر اختيار ملف PDF.');\n    }\n  };\n\n'''
          if pdf_fn not in s:
              if insert_after not in s: raise SystemExit('PDF insertion anchor not found')
              s = s.replace(insert_after, pdf_fn + insert_after, 1)
          patch('app/ministry-books.tsx', "      const searchMatch =\n        !q ||\n        book.title.toLowerCase().includes(q) ||", "      const searchMatch =\n        !q ||\n        (book.pdfName ?? '').toLowerCase().includes(q) ||\n        book.title.toLowerCase().includes(q) ||")
          patch('app/ministry-books.tsx', "    if (!imageUri) {\n      Alert.alert(\n        'تنبيه',\n        'اختر صورة الكتاب أولاً.'\n      );\n\n      return;\n    }", "    if (!imageUri && !pdfUri) {\n      Alert.alert(\n        'تنبيه',\n        'أضف صورة الكتاب أو ملف PDF واحداً على الأقل.'\n      );\n\n      return;\n    }")
          patch('app/ministry-books.tsx', "      imageUri,\n\n      notes:", "      imageUri,\n      pdfUri: pdfUri || undefined,\n      pdfName: pdfName || undefined,\n\n      notes:")
          # Add PDF button beside image actions.
          image_action_anchor = "              {imageUri ? (\n                <View style={styles.imageActions}>"
          pdf_button = """              <Pressable\n                onPress={pickPdf}\n                style={[styles.changeImageButton, { borderColor: c.border }]}\n              >\n                <Feather name=\"file-text\" size={16} color={c.primary} />\n                <Text style={{ color: c.primary, fontFamily: 'Inter_600SemiBold' }}>إضافة PDF</Text>\n              </Pressable>\n\n              {pdfName ? (\n                <View style={[styles.pdfBadge, { backgroundColor: c.secondary }]}>\n                  <Feather name=\"file\" size={15} color={c.primary} />\n                  <Text style={[styles.pdfBadgeText, { color: c.primary }]} numberOfLines={1}>{pdfName}</Text>\n                </View>\n              ) : null}\n\n"""
          if image_action_anchor not in s: raise SystemExit('image action anchor not found')
          s = s.replace(image_action_anchor, pdf_button + image_action_anchor, 1)
          # Add a PDF viewer button in each book card and pass callback.
          patch('app/ministry-books.tsx', "              onDelete={() =>\n                confirmDelete(book)\n              }\n            />", "              onDelete={() =>\n                confirmDelete(book)\n              }\n              onPdfPress={book.pdfUri ? () => router.push({ pathname: '/ministry-book-viewer', params: { uri: book.pdfUri!, name: book.pdfName || book.title } }) : undefined}\n            />")
          patch('app/ministry-books.tsx', "  onDelete,\n}: {", "  onDelete,\n  onPdfPress,\n}: {")
          patch('app/ministry-books.tsx', "  onDelete: () => void;\n}) {", "  onDelete: () => void;\n  onPdfPress?: () => void;\n}) {")
          # Add PDF button before closing book actions.
          action_anchor = "          <Pressable\n            onPress={onImagePress}\n            style={[\n              styles.actionButton,"
          pdf_card_button = """          {onPdfPress ? (\n            <Pressable\n              onPress={onPdfPress}\n              style={[styles.actionButton, { backgroundColor: c.secondary }]}\n            >\n              <Feather name=\"file-text\" size={16} color={c.primary} />\n              <Text style={{ color: c.primary, fontFamily: 'Inter_600SemiBold', fontSize: 11 }}>PDF</Text>\n            </Pressable>\n          ) : null}\n\n"""
          if action_anchor not in s: raise SystemExit('book action anchor not found')
          s = s.replace(action_anchor, pdf_card_button + action_anchor, 1)
          # Extra styles.
          style_anchor = "  bookNotes: {"
          style_insert = "  pdfBadge: { flexDirection: 'row-reverse', alignItems: 'center', gap: 6, borderRadius: 9, paddingHorizontal: 9, paddingVertical: 7, marginTop: 7 },\n  pdfBadgeText: { flex: 1, fontFamily: 'Inter_500Medium', fontSize: 10, textAlign: 'right' },\n\n  bookNotes: {"
          if style_anchor not in s: raise SystemExit('ministry style anchor not found')
          s = s.replace(style_anchor, style_insert, 1)
          p.write_text(s, encoding='utf-8')

          # Commit all changes; the temporary workflow removes itself.
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '.'], check=True)
          subprocess.run(['git', 'rm', '-f', '.github/workflows/apply-v3-improvements.yml'], check=True)
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: apply v3 improvements'], check=True)
          subprocess.run(['git', 'push'], check=True)
