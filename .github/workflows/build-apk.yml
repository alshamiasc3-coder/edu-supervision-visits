name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ai-integration

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Verify API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL is not configured in GitHub repository variables."
            exit 1
          fi
          echo "API URL configured: $EXPO_PUBLIC_API_URL"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edu-supervision-visits-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
