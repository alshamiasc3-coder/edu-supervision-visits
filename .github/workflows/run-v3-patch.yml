name: Run v3 patch

on:
  push:
    branches:
      - improvements-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply v3 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_v3_patch.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add context/AppContext.tsx app/visit-form.tsx app/image-viewer.tsx scripts/apply_v3_patch.py
          git rm -f .github/workflows/run-v3-patch.yml
          git commit -m 'chore: apply v3 patch'
          git push
